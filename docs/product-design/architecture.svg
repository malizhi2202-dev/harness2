<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">Harness² 双层递归 Agent Harness 优化架构</title>
  <desc id="desc">按 harness2 实际代码展示基线执行、并行和串行任务级递归、盲选、反思经验库，以及后续任务从 base harness 起步并读取经验作为参考的流程。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#07875b"/></marker>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#45617f"/></marker>
    <style>
      text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#102a4c}
      .title{font-size:34px;font-weight:750}.sub{font-size:17px;fill:#536982}
      .panel-title{font-size:22px;font-weight:750}.label{font-size:17px;font-weight:700}
      .body{font-size:15px;fill:#314b69}.small{font-size:13px;fill:#526a83}
      .tiny{font-size:12px;fill:#536982}.center{text-anchor:middle}
      .box{fill:#fff;stroke:#c6d7eb;stroke-width:1.5}.bluebox{fill:#f5f9ff;stroke:#a9c9f5;stroke-width:1.5}
      .greenbox{fill:#f2fbf6;stroke:#a7dfc2;stroke-width:1.5}.purplebox{fill:#f8f5ff;stroke:#d7c9fa;stroke-width:1.4}
      .arrow{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrow-blue)}
      .green-arrow{fill:none;stroke:#07875b;stroke-width:3;marker-end:url(#arrow-green)}
      .muted-arrow{fill:none;stroke:#7890aa;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow-dark)}
    </style>
  </defs>
  <rect width="1600" height="1160" rx="24" fill="#f8fbff"/>
  <text x="800" y="52" class="title center">Harness² 双层递归 Agent Harness 优化架构</text>
  <text x="800" y="82" class="sub center">固定模型权重，围绕任务证据优化执行框架；按 harness2 当前实现绘制</text>

  <!-- Inputs and the common baseline -->
  <g>
    <rect x="28" y="108" width="315" height="124" rx="15" class="box"/>
    <text x="185" y="140" class="label center">任务输入 T</text>
    <text x="185" y="169" class="body center">任务说明 + 源材料</text>
    <text x="185" y="195" class="small center">不向提案 / 选择会话暴露评分答案</text>

    <rect x="370" y="108" width="315" height="124" rx="15" class="box"/>
    <text x="527" y="140" class="label center">基准 Harness H₀</text>
    <text x="527" y="169" class="body center">adapter.base_harness()</text>
    <text x="527" y="195" class="small center">每个新任务从这里开始</text>

    <rect x="712" y="108" width="370" height="124" rx="15" class="box"/>
    <text x="897" y="140" class="label center">共享基线执行</text>
    <text x="897" y="169" class="body center">同一 H₀ 执行 k 次，形成 RunView</text>
    <text x="897" y="195" class="small center">任务级递归两种模式共用这些基线</text>

    <rect x="1110" y="108" width="462" height="124" rx="15" fill="#eef5ff" stroke="#98bdf0" stroke-width="1.5"/>
    <text x="1341" y="140" class="label center">同领域经验（若已存在）</text>
    <text x="1341" y="169" class="body center">完整采纳树 + EXPERIENCE.md / INDEX.md</text>
    <text x="1341" y="195" class="small center">作为提案参考证据；不会自动替换 H₀</text>
    <path d="M343 170H362" class="arrow"/><path d="M685 170H704" class="arrow"/>
    <path d="M897 232V251" class="arrow"/>
    <path d="M1160 232V251" class="green-arrow"/>
  </g>

  <!-- Task-level recursion -->
  <rect x="24" y="258" width="1552" height="438" rx="22" fill="#edf5ff" stroke="#8bb9f3" stroke-width="2"/>
  <path d="M24 280Q24 258 46 258H1554Q1576 258 1576 280V306H24Z" fill="#2376dc"/>
  <text x="54" y="290" font-size="21" font-weight="750" fill="#fff">任务级递归 · Task-level recursion</text>
  <text x="1540" y="289" font-size="14" text-anchor="end" fill="#e8f2ff">在单个任务内形成候选、取得行为证据、生成可比较终版</text>

  <text x="47" y="337" class="label" fill="#1c5ca8">并行模式 agg · 一次宽探</text>
  <g>
    <rect x="45" y="352" width="328" height="119" rx="13" class="bluebox"/>
    <text x="209" y="382" class="label center">① 提案 Propose · 2k stages</text>
    <text x="209" y="410" class="body center">k 个 INV + k 个 DOM</text>
    <text x="209" y="436" class="small center">各自基于 H₀、共享基线与领域经验</text>
    <text x="209" y="457" class="tiny center">提案全部结束后才进入下一阶段</text>

    <rect x="427" y="352" width="328" height="119" rx="13" class="bluebox"/>
    <text x="591" y="382" class="label center">② 候选试跑 Probe · 2k</text>
    <text x="591" y="410" class="body center">每个提案树真实执行一次</text>
    <text x="591" y="436" class="small center">收集轨迹、交付物与 delivered 状态</text>
    <text x="591" y="457" class="tiny center">不以 grader 分数指导改进</text>

    <rect x="809" y="352" width="328" height="119" rx="13" class="bluebox"/>
    <text x="973" y="382" class="label center">③ 合成 Compose · k 会话</text>
    <text x="973" y="410" class="body center">每个合成器独立查看全部 2k 候选</text>
    <text x="973" y="436" class="small center">综合候选树、试跑证据与决策记录</text>
    <text x="973" y="457" class="tiny center">可合并、采纳、KEEP_BASE</text>

    <rect x="1191" y="352" width="364" height="119" rx="13" class="bluebox"/>
    <text x="1373" y="382" class="label center">④ 终版执行 · k rollouts</text>
    <text x="1373" y="410" class="body center">产出 agg1 … aggk</text>
    <text x="1373" y="436" class="small center">终版交付物进入后续盲选池</text>
    <path d="M373 411H418" class="arrow"/><path d="M755 411H800" class="arrow"/><path d="M1137 411H1182" class="arrow"/>
  </g>

  <line x1="45" y1="490" x2="1555" y2="490" stroke="#c8dbf4" stroke-width="1.5"/>
  <text x="47" y="522" class="label" fill="#1c5ca8">串行模式 seq · k 轮递进</text>
  <g>
    <rect x="45" y="537" width="328" height="119" rx="13" class="bluebox"/>
    <text x="209" y="567" class="label center">每轮提案 · INV + DOM</text>
    <text x="209" y="595" class="body center">编辑对象：H₀ 或上一轮 cₜ₋₁</text>
    <text x="209" y="621" class="small center">证据含共享基线及已产生的历史</text>
    <text x="209" y="642" class="tiny center">两个提案会话并发</text>

    <rect x="427" y="537" width="328" height="119" rx="13" class="bluebox"/>
    <text x="591" y="567" class="label center">候选试跑 · 2 次 / 轮</text>
    <text x="591" y="595" class="body center">分别运行 INV、DOM 候选</text>
    <text x="591" y="621" class="small center">轨迹、交付物加入本轮证据池</text>
    <text x="591" y="642" class="tiny center">probe 后再启动合成</text>

    <rect x="809" y="537" width="328" height="119" rx="13" class="bluebox"/>
    <text x="973" y="567" class="label center">合成一个 checkpoint</text>
    <text x="973" y="595" class="body center">生成 cₜ，执行一次得到新证据</text>
    <text x="973" y="621" class="small center">可保留当前树或恢复更早 checkpoint</text>
    <text x="973" y="642" class="tiny center">cₜ 加入历史，供下一轮读取</text>

    <rect x="1191" y="537" width="364" height="119" rx="13" fill="#e7f1ff" stroke="#8bb9f3" stroke-width="1.5"/>
    <text x="1373" y="567" class="label center">k 轮完成后</text>
    <text x="1373" y="595" class="body center">选择池为 c₁ … cₖ</text>
    <text x="1373" y="621" class="small center">c₁ … cₖ 都是各轮终版</text>
    <text x="1373" y="642" class="tiny center">不是只选最后一轮 cₖ</text>
    <path d="M373 596H418" class="arrow"/><path d="M755 596H800" class="arrow"/><path d="M1137 596H1182" class="arrow"/>
    <path d="M973 661C973 682 590 682 590 661" fill="none" stroke="#5b8fd6" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-blue)"/>
    <text x="785" y="679" class="tiny center">循环 t = 1 … k</text>
  </g>

  <!-- Adopt and reflect -->
  <path d="M1555 411H1563M1555 596H1563" fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M1563 411V719H342V736" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="42" y="744" width="600" height="116" rx="16" fill="#fff" stroke="#a8c7ed" stroke-width="1.5"/>
  <text x="342" y="775" class="label center">盲选 Blind selection</text>
  <text x="342" y="803" class="body center">匿名化可交付 finals，只看交付物选择</text>
  <text x="342" y="830" class="small center">不看 harness 身份或 grader 分数；k=1 时直接交付唯一 final</text>

  <rect x="682" y="744" width="360" height="116" rx="16" class="greenbox"/>
  <text x="862" y="775" class="label center">采纳结果</text>
  <text x="862" y="803" class="body center">选中的 harness H* + run 结果</text>
  <text x="862" y="830" class="small center">交付任务结果；之后可独立运行 judge</text>

  <rect x="1082" y="744" width="473" height="116" rx="16" class="greenbox"/>
  <text x="1318" y="775" class="label center">反思 Reflection（配置经验库时）</text>
  <text x="1318" y="803" class="body center">对照 base、所有改动、轨迹、产物与决策</text>
  <text x="1318" y="830" class="small center">写 edits 表，并尝试提炼一条经验</text>
  <path d="M642 802H674" class="green-arrow"/><path d="M1042 802H1074" class="green-arrow"/>

  <!-- Cross-task experience loop -->
  <rect x="42" y="881" width="1513" height="112" rx="18" fill="#eaf9f1" stroke="#87d4ac" stroke-width="1.7"/>
  <text x="72" y="913" class="panel-title" fill="#08794f">跨任务经验递归 · Harnessing-level recursion</text>
  <text x="1525" y="912" class="small" text-anchor="end">这是经验传递回路：存档后供后续任务参考</text>
  <rect x="68" y="930" width="420" height="48" rx="10" class="greenbox"/>
  <text x="278" y="950" class="label center">反思输出：edits + cue / lesson / evidence</text>
  <text x="278" y="969" class="tiny center">没有完整三字段则不形成经验条目</text>
  <rect x="600" y="930" width="420" height="48" rx="10" class="greenbox"/>
  <text x="810" y="950" class="label center">条件入库：完整采纳树 + EXPERIENCE.md</text>
  <text x="810" y="969" class="tiny center">重建 INDEX；按 run / mode / domain 隔离</text>
  <rect x="1132" y="930" width="392" height="48" rx="10" class="greenbox"/>
  <text x="1328" y="950" class="label center">后续任务把经验作为参考证据</text>
  <text x="1328" y="969" class="tiny center">不会自动应用旧树，仍从 base harness 起步</text>
  <path d="M488 954H592" class="green-arrow"/><path d="M1020 954H1124" class="green-arrow"/>
  <path d="M1328 993V1014H1585V245H1341V239" fill="none" stroke="#07875b" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="755" y="1012" class="small center" fill="#08794f">进入下一任务的提案上下文，作为可检索的历史经验</text>

  <!-- Editable surface -->
  <rect x="24" y="1030" width="1552" height="106" rx="17" fill="#f3f0ff" stroke="#cfc0f8" stroke-width="1.5"/>
  <text x="48" y="1060" class="label">可编辑面 c1–c8 · 执行器 SurfaceSpec 定义路径、约束与投影</text>
  <text x="1550" y="1060" class="small" text-anchor="end">模型权重固定</text>
  <g class="center">
    <rect x="43" y="1075" width="180" height="43" rx="9" class="purplebox"/><text x="133" y="1093" class="small center">c1 系统提示词</text><text x="133" y="1110" class="tiny center">角色与行为</text>
    <rect x="235" y="1075" width="180" height="43" rx="9" class="purplebox"/><text x="325" y="1093" class="small center">c2 护栏</text><text x="325" y="1110" class="tiny center">约束与边界</text>
    <rect x="427" y="1075" width="180" height="43" rx="9" class="purplebox"/><text x="517" y="1093" class="small center">c3 记忆</text><text x="517" y="1110" class="tiny center">常驻信息</text>
    <rect x="619" y="1075" width="180" height="43" rx="9" class="purplebox"/><text x="709" y="1093" class="small center">c4 工具说明</text><text x="709" y="1110" class="tiny center">工具用法</text>
    <rect x="811" y="1075" width="180" height="43" rx="9" class="purplebox"/><text x="901" y="1093" class="small center">c5 子代理</text><text x="901" y="1110" class="tiny center">角色分工</text>
    <rect x="1003" y="1075" width="180" height="43" rx="9" class="purplebox"/><text x="1093" y="1093" class="small center">c6 技能</text><text x="1093" y="1110" class="tiny center">按需能力</text>
    <rect x="1195" y="1075" width="180" height="43" rx="9" class="purplebox"/><text x="1285" y="1093" class="small center">c7 脚本</text><text x="1285" y="1110" class="tiny center">辅助程序</text>
    <rect x="1387" y="1075" width="169" height="43" rx="9" class="purplebox"/><text x="1471" y="1093" class="small center">c8 插件 / hooks</text><text x="1471" y="1110" class="tiny center">工具循环扩展</text>
  </g>
  <path d="M806 1030V1000" class="muted-arrow"/>
</svg>
