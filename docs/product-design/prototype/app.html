<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Harness² Console · 递归 agent harnessing 控制台</title>
<style>
/* ============================================================
   Harness² Console —— 单页前端实现
   设计源：docs/product-design/PRODUCT-DESIGN.html §6 + prototype/assets/base.css
   调性：Industrial Console（工业暗色操作台，单一品牌蓝，数据密度优先）
   零外链：无字体/CDN/图片，全部本地字体栈与内联 SVG
   ============================================================ */
:root{
  --bg-app:#0d0e12;         --bg-app:oklch(0.145 0.006 275);
  --bg-sidebar:#0f1015;     --bg-sidebar:oklch(0.16 0.006 275);
  --bg-main:#13141a;        --bg-main:oklch(0.18 0.007 275);
  --bg-card:#181a1f;        --bg-card:oklch(0.21 0.008 275);
  --bg-card-hover:#1e2028;  --bg-card-hover:oklch(0.24 0.009 275);
  --bg-input:#0b0c10;       --bg-input:oklch(0.13 0.006 275);
  --bg-tooltip:#22242a;
  --bg-selected:rgba(84,140,240,0.10);

  --blue:#548cf0;           --blue:oklch(0.65 0.16 262);
  --blue-hover:#6a9df4;     --blue-hover:oklch(0.71 0.15 262);
  --blue-bg:rgba(84,140,240,0.08);
  --blue-border:rgba(84,140,240,0.20);

  --green:#5cb878;          --green-bg:rgba(92,184,120,0.08);
  --red:#e05555;            --red-bg:rgba(224,85,85,0.08);
  --orange:#e8a450;         --orange-bg:rgba(232,164,80,0.08);
  --purple:#b47cd8;         --purple-bg:rgba(180,124,216,0.08);

  --text:#e1e2e5;           --text:oklch(0.91 0.004 275);
  --text-secondary:#9699a0; --text-secondary:oklch(0.66 0.008 275);
  --text-muted:#5d6068;     --text-muted:oklch(0.47 0.008 275);

  --border:rgba(255,255,255,0.06);
  --border-strong:rgba(255,255,255,0.10);

  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  --font-mono:"JetBrains Mono","Fira Code","SF Mono",Consolas,"PingFang SC",monospace;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px;
  --r-sm:4px; --r-md:8px; --r-lg:12px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 4px 12px rgba(0,0,0,.4);
  --shadow-lg:0 24px 60px rgba(0,0,0,.45);
  --ease:cubic-bezier(.16,0,.2,1); --fast:100ms; --normal:200ms;
  --side-w:232px;
}

*{box-sizing:border-box}
html,body{height:100%}
html{overflow:hidden}
body{
  margin:0; background:var(--bg-app); color:var(--text);
  font:14px/1.6 var(--font); -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
a{color:var(--blue); text-decoration:none}
a:hover{text-decoration:underline}
code,.mono{font-family:var(--font-mono); font-size:.92em}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:var(--r-sm)}
::selection{background:rgba(84,140,240,.28)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18)}
.sprite{display:none}
[hidden]{display:none !important}

/* ---------- 应用骨架 ---------- */
.app{display:grid; grid-template-columns:var(--side-w) minmax(0,1fr); height:100vh; height:100dvh}
.app.side-collapsed{--side-w:56px}

.side{
  background:var(--bg-sidebar); border-right:1px solid var(--border);
  display:flex; flex-direction:column; min-height:0; position:relative; z-index:20;
}
.side-brand{
  display:flex; align-items:center; gap:var(--s2); height:48px; padding:0 12px;
  border-bottom:1px solid var(--border); flex:0 0 auto;
}
.side-brand i{
  width:22px;height:22px;border-radius:5px;background:var(--blue);color:#fff;
  display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;
  letter-spacing:-.4px; flex:0 0 auto;
}
.side-brand .name{font-size:13.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.side-brand .env{margin-left:auto;font-size:10px;color:var(--text-muted);font-family:var(--font-mono)}
.app.side-collapsed .side-brand .name,
.app.side-collapsed .side-brand .env,
.app.side-collapsed .nav-grp,
.app.side-collapsed .nav-item span,
.app.side-collapsed .side-foot span{display:none}
.app.side-collapsed .side-brand{justify-content:center;padding:0}
.app.side-collapsed .nav-item{justify-content:center;padding:8px 0;border-left-width:0}

.side-nav{flex:1 1 auto; overflow-y:auto; padding:10px 8px 16px; min-height:0}
.nav-grp{
  margin:12px 0 5px; padding:0 8px; font-size:10px; font-weight:700; letter-spacing:.09em;
  text-transform:uppercase; color:var(--text-muted);
}
.nav-grp:first-child{margin-top:2px}
.nav-item{
  display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:6px;
  color:var(--text-secondary); border-left:2px solid transparent; cursor:pointer;
  font-size:12.5px; margin:1px 0; transition:background var(--fast),color var(--fast);
  white-space:nowrap; text-decoration:none;
}
.nav-item:hover{background:var(--bg-card); color:var(--text); text-decoration:none}
.nav-item[aria-current="page"]{background:var(--bg-selected); color:var(--blue); border-left-color:var(--blue); font-weight:600}
.nav-item .icon{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.nav-item .count{margin-left:auto;font-size:10px;color:var(--text-muted);font-family:var(--font-mono)}
.side-foot{
  border-top:1px solid var(--border); padding:10px 12px; display:flex; align-items:center; gap:8px;
  font-size:11px; color:var(--text-muted); flex:0 0 auto;
}
.side-foot .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px rgba(92,184,120,.55)}
.side-foot b{color:var(--text-secondary);font-weight:600;font-family:var(--font-mono);font-size:10.5px}

.main{display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--bg-app)}
.topbar{
  height:48px; flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:0 16px;
  border-bottom:1px solid var(--border); background:var(--bg-main); z-index:15;
}
.topbar .icon-btn{display:none}
.crumb{min-width:0; display:flex; align-items:baseline; gap:7px; font-size:12.5px; white-space:nowrap; overflow:hidden}
.crumb b{font-weight:650; color:var(--text)}
.crumb .sep{color:var(--text-muted)}
.crumb .dim{color:var(--text-muted); font-family:var(--font-mono); font-size:11.5px; overflow:hidden; text-overflow:ellipsis}
.top-actions{margin-left:auto; display:flex; align-items:center; gap:7px; flex:0 0 auto}
.demo-badge{font-size:10.5px}
.content{
  flex:1 1 auto; overflow-y:auto; overflow-x:hidden; min-height:0;
  padding:18px 20px 56px; scroll-behavior:smooth;
}
.wrap{max-width:1440px; margin:0 auto}
.view-head{display:flex; align-items:flex-start; gap:12px; margin:2px 0 16px}
.view-head h1{font-size:19px; font-weight:700; letter-spacing:-.3px; margin:0}
.view-head p{margin:3px 0 0; font-size:12.5px; color:var(--text-secondary); max-width:820px}
.view-head .spacer{flex:1}
.view-head .actions{display:flex; gap:7px; align-items:center; flex-wrap:wrap; justify-content:flex-end}

/* ---------- 基础控件 ---------- */
.chip{
  display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;
  border:1px solid var(--border-strong);background:var(--bg-card);color:var(--text-secondary);
  font-size:11px;white-space:nowrap; line-height:1;
}
.chip.ok{color:var(--green);border-color:rgba(92,184,120,.3);background:var(--green-bg)}
.chip.warn{color:var(--orange);border-color:rgba(232,164,80,.3);background:var(--orange-bg)}
.chip.bad{color:var(--red);border-color:rgba(224,85,85,.3);background:var(--red-bg)}
.chip.info{color:var(--blue);border-color:var(--blue-border);background:var(--blue-bg)}
.chip.purple{color:var(--purple);border-color:rgba(180,124,216,.3);background:var(--purple-bg)}
.chip.mono{font-family:var(--font-mono);font-size:10.5px}
.chip.xs{height:18px;font-size:10px;padding:0 6px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 11px;
  border-radius:var(--r-sm); border:1px solid var(--border-strong); background:var(--bg-card);
  color:var(--text); font:500 12.5px var(--font); cursor:pointer;
  transition:background var(--fast),border-color var(--fast),color var(--fast);
  white-space:nowrap;
}
.btn:hover{background:var(--bg-card-hover)}
.btn:active{transform:translateY(.5px)}
.btn .icon{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-hover);border-color:var(--blue-hover)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--bg-card)}
.btn.sm{height:24px;padding:0 9px;font-size:11.5px}
.btn.danger{color:var(--red);border-color:rgba(224,85,85,.35);background:var(--red-bg)}
.btn.danger:hover{background:rgba(224,85,85,.15)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.link{border:0;background:none;color:var(--blue);padding:0 4px;height:auto}

.icon-btn{
  display:inline-grid;place-items:center;width:28px;height:28px;border-radius:var(--r-sm);
  border:1px solid transparent;background:transparent;color:var(--text-secondary);cursor:pointer;
}
.icon-btn:hover{background:var(--bg-card);color:var(--text)}
.icon-btn .icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.search{
  display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:var(--r-sm);
  background:var(--bg-input);border:1px solid var(--border);color:var(--text-muted);min-width:180px;
}
.search:focus-within{border-color:var(--blue-border);box-shadow:0 0 0 3px rgba(84,140,240,.10)}
.search .icon{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.search input{
  flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);
  font:12px var(--font);
}
.search input::placeholder{color:var(--text-muted)}
.select{
  height:28px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg-card);
  color:var(--text);font:12px var(--font);padding:0 8px;cursor:pointer;
}
.kbd{
  display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;
  border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;
  font:10.5px var(--font-mono); color:var(--text-secondary); background:var(--bg-card);
}

/* ---------- 面板 / 排版 ---------- */
.panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s4);min-width:0}
.panel.tight{padding:12px}
.panel-head{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.panel-head h3{margin:0;font-size:12.5px;font-weight:650;color:var(--text)}
.panel-head .sub{font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}
.panel-head .spacer{flex:1}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin:0 0 7px}
.muted{color:var(--text-secondary)}
.dim{color:var(--text-muted)}
.tiny{font-size:11.5px}
.small{font-size:12.5px}
.mono-s{font-family:var(--font-mono);font-size:12px}
.note{font-size:11.5px;color:var(--text-muted);margin:10px 0 0;line-height:1.6}
.note b{color:var(--text-secondary);font-weight:600}
.two-col{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--s3);align-items:start}
.two-col.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.stack{display:grid;gap:var(--s3)}
.hr{border:0;border-top:1px solid var(--border);margin:14px 0}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s3);margin-bottom:var(--s4)}
.kpis.six{grid-template-columns:repeat(6,minmax(0,1fr))}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.kpi{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-md);
  padding:11px 13px;min-width:0;position:relative;overflow:hidden;
}
.kpi .k{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted)}
.kpi .v{font-family:var(--font-mono);font-size:19px;font-weight:650;line-height:1.3;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:10.5px;color:var(--text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.good .v{color:var(--green)} .kpi.blue .v{color:var(--blue)}
.kpi.warn .v{color:var(--orange)} .kpi.bad .v{color:var(--red)}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent}
.kpi.good::after{background:var(--green)} .kpi.blue::after{background:var(--blue)}
.kpi.warn::after{background:var(--orange)} .kpi.bad::after{background:var(--red)}

/* ---------- 表格 ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg-card)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{
  text-align:left;font-weight:600;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--text-muted);background:var(--bg-main);padding:7px 10px;border-bottom:1px solid var(--border);
  white-space:nowrap;position:sticky;top:0;
}
table.tbl td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text-secondary)}
table.tbl td b{color:var(--text);font-weight:600}
table.tbl td.num,table.tbl th.num{font-family:var(--font-mono);font-size:11.5px;white-space:nowrap}
table.tbl tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover td{background:var(--bg-card-hover)}
table.tbl tr.empty-row td{color:var(--text-muted);font-style:italic;background:transparent}
table.tbl td .rowlink{color:var(--blue);font-family:var(--font-mono);font-size:11.5px}
table.tbl td .rowlink:hover{text-decoration:underline}
table.tbl tr.grp td{background:var(--bg-main);font-size:10.5px;color:var(--text-muted);letter-spacing:.04em;text-transform:uppercase}

/* ---------- 代码 / 预格式 ---------- */
pre.code,pre.diff{
  margin:0;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:10px 12px;font-family:var(--font-mono);font-size:11.5px;line-height:1.65;
  color:var(--text-secondary);overflow:auto;max-height:340px;white-space:pre;tab-size:2;
}
pre.diff .add{color:var(--green)} pre.diff .del{color:var(--red)} pre.diff .hunk{color:var(--blue)}
pre.code::-webkit-scrollbar,pre.diff::-webkit-scrollbar{height:7px;width:7px}

/* ---------- 时间线 ---------- */
.timeline{position:relative;padding-left:15px;margin:2px 0}
.timeline::before{content:"";position:absolute;left:4px;top:5px;bottom:5px;width:1px;background:var(--border-strong)}
.tl-item{position:relative;padding:2px 0 9px;font-size:12px;color:var(--text-secondary);line-height:1.55}
.tl-item::before{content:"";position:absolute;left:-15px;top:7px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.tl-item.warn::before{background:var(--orange)} .tl-item.bad::before{background:var(--red)}
.tl-item .t{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-right:6px}
.tl-item b{color:var(--text);font-weight:600}

/* ---------- 流水线 ---------- */
.pipe{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:var(--s3);align-items:start}
.pipe::-webkit-scrollbar{height:8px}
.stage{background:var(--bg-main);border:1px solid var(--border);border-radius:var(--r-md);padding:10px;min-width:0}
.stage-head{display:flex;align-items:center;gap:7px;margin:0 0 4px}
.stage-head .n{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--font-mono);font-size:10px;background:var(--bg-card);border:1px solid var(--border-strong);color:var(--text-secondary)}
.stage-head h4{margin:0;font-size:12px;font-weight:650}
.stage-head .count{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
.stage>p.hint{margin:0 0 9px;font-size:10.5px;color:var(--text-muted);line-height:1.5}
.cand{
  background:var(--bg-card);border:1px solid var(--border);border-left:2px solid var(--text-muted);
  border-radius:var(--r-sm);padding:8px 9px;margin-bottom:7px;cursor:pointer;
  transition:background var(--fast),border-color var(--fast),transform var(--fast);
}
.cand:hover{background:var(--bg-card-hover);transform:translateY(-1px)}
.cand:last-child{margin-bottom:0}
.cand.ok{border-left-color:var(--green)} .cand.warn{border-left-color:var(--orange)}
.cand.bad{border-left-color:var(--red)} .cand.plain{border-left-color:var(--border-strong)}
.cand-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.cand-top .label{font-family:var(--font-mono);font-size:11.5px;font-weight:650;color:var(--text)}
.cand-top .spacer{flex:1}
.cand p{margin:0;font-size:11.5px;color:var(--text-secondary);line-height:1.5}
.cand .meta{margin-top:5px;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);display:flex;gap:8px;flex-wrap:wrap}
.cand .probe{margin-top:6px;display:flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}
.cand .probe .v{font-weight:650}
.cand .probe .v.ok{color:var(--green)} .cand .probe .v.bad{color:var(--red)}
.cand.retry{border-style:dashed;border-left-style:dashed;border-left-color:var(--orange);background:transparent}
.cand.retry:hover{background:var(--bg-card)}

/* ---------- 证据 ---------- */
.ev-grid{display:grid;grid-template-columns:246px minmax(0,1fr) 296px;gap:var(--s3);align-items:start}
.tree{padding:4px}
.tree-row{
  display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:5px;cursor:pointer;
  font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;
}
.tree-row:hover{background:var(--bg-card-hover)}
.tree-row.on{background:var(--bg-selected);color:var(--text)}
.tree-row .icon{width:14px;height:14px;color:var(--text-muted);flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tree-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-mono);font-size:11.5px}
.tree-row .desc{font-size:10.5px;color:var(--text-muted);font-family:var(--font)}
.tree-row.child{padding-left:23px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:0 0 12px;overflow-x:auto}
.tab{
  padding:6px 11px;font-size:12px;color:var(--text-muted);border-bottom:2px solid transparent;
  margin-bottom:-1px;cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;
  white-space:nowrap;
}
.tab:hover{color:var(--text-secondary)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--blue);font-weight:600}
.file-pills{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.pill{
  border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg-card);
  padding:3px 9px;font-size:11px;color:var(--text-secondary);cursor:pointer;
}
.pill:hover{border-color:var(--blue-border);color:var(--text)}
.pill.on{background:var(--blue-bg);border-color:var(--blue-border);color:var(--blue)}
.pill.mono{font-family:var(--font-mono)}
.checklist{list-style:none;margin:0;padding:0;font-size:12px}
.checklist li{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);color:var(--text-secondary)}
.checklist li:last-child{border-bottom:0}
.checklist .ic{width:15px;height:15px;flex:0 0 auto;margin-top:2px;stroke:var(--green);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.checklist.no .ic{stroke:var(--text-muted)}

/* ---------- 经验库 ---------- */
.lib-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s3);align-items:start}
.lib-entries{display:flex;flex-direction:column;gap:7px}
.entry{
  border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg-card);padding:10px 12px;
  cursor:pointer;transition:background var(--fast),border-color var(--fast);
}
.entry:hover{background:var(--bg-card-hover)}
.entry.on{border-color:var(--blue-border);background:var(--blue-bg)}
.entry .top{display:flex;align-items:center;gap:8px}
.entry .top .id{font-family:var(--font-mono);font-size:12px;font-weight:650;color:var(--text)}
.entry .top .spacer{flex:1}
.entry .cue{margin:5px 0 0;font-size:11.5px;color:var(--text-secondary)}
.entry .lesson{margin:3px 0 0;font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}
.empty-soft{
  border:1px dashed var(--border-strong);border-radius:var(--r-md);padding:20px 16px;text-align:center;
  color:var(--text-muted);font-size:12px;background:var(--bg-main);
}
.empty-soft b{display:block;color:var(--text-secondary);font-size:12.5px;margin-bottom:3px}

/* ---------- 抽屉 / 弹层 / toast ---------- */
.layers{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:60}
.mask{position:fixed;inset:0;pointer-events:none;background:rgba(8,10,16,.55);opacity:0;pointer-events:none;transition:opacity var(--normal);z-index:60;backdrop-filter:blur(1px)}
.mask.on{opacity:1;pointer-events:auto}
.drawer.on,.modal.on,.pop.on{pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;height:100vh;height:100dvh;width:min(540px,94vw);
  background:var(--bg-card);border-left:1px solid var(--border-strong);z-index:61;
  transform:translateX(102%);visibility:hidden;
  transition:transform var(--normal) var(--ease),visibility 0s linear var(--normal);
  display:flex;flex-direction:column;box-shadow:-16px 0 40px rgba(0,0,0,.4);
}
.drawer.on{transform:none;visibility:visible;transition:transform var(--normal) var(--ease)}
.drawer header{
  display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--border);
  flex:0 0 auto;background:var(--bg-card);
}
.drawer header h2{margin:0;font-size:13.5px;font-weight:650}
.drawer .body{padding:16px;overflow-y:auto;flex:1 1 auto;min-height:0}
.modal{
  position:fixed;left:50%;top:16%;transform:translateX(-50%) translateY(-6px) scale(.98);
  width:min(460px,92vw);background:var(--bg-card);border:1px solid var(--border-strong);
  border-radius:var(--r-lg);z-index:62;opacity:0;pointer-events:none;visibility:hidden;
  transition:opacity var(--normal),transform var(--normal) var(--ease),visibility 0s linear var(--normal);
  box-shadow:var(--shadow-lg);
}
.modal.on{opacity:1;pointer-events:auto;visibility:visible;transform:translateX(-50%) scale(1);
  transition:opacity var(--normal),transform var(--normal) var(--ease)}
.modal header{display:flex;align-items:center;gap:8px;padding:14px 16px 0}
.modal header h2{margin:0;font-size:14px;font-weight:650}
.modal .body{padding:10px 16px 4px;font-size:12.5px;color:var(--text-secondary);line-height:1.65}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 16px 16px}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);
  background:var(--text);color:var(--bg-app);padding:8px 16px;border-radius:8px;
  font-size:12.5px;opacity:0;transition:opacity var(--normal),transform var(--normal);
  z-index:70;max-width:80vw;box-shadow:var(--shadow-md);pointer-events:none;
}
.toast.on{opacity:1;transform:translateX(-50%)}
.pop{
  position:absolute;background:var(--bg-tooltip);border:1px solid var(--border-strong);border-radius:var(--r-md);
  box-shadow:var(--shadow-md);z-index:55;min-width:190px;max-width:min(320px,calc(100vw - 16px));padding:6px;
  opacity:0;pointer-events:none;transform:translateY(4px);transition:opacity var(--fast),transform var(--fast);
}
.pop.on{opacity:1;pointer-events:auto;transform:none}
.pop .item{display:flex;align-items:center;gap:8px;width:100%;padding:6px 9px;border-radius:5px;
  font:12px var(--font);text-align:left;background:none;border:0;
  color:var(--text-secondary);cursor:pointer;white-space:nowrap}
.pop .item:hover{background:var(--bg-card-hover);color:var(--text)}
.pop .item[aria-checked="true"]{color:var(--blue)}
.pop .item .k{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
.pop .sep{height:1px;background:var(--border);margin:5px 2px}

/* ---------- 四态 ---------- */
.skeleton{display:grid;gap:10px}
.sk{background:linear-gradient(100deg,var(--bg-card) 30%,var(--bg-card-hover) 50%,var(--bg-card) 70%);
  background-size:300% 100%;animation:shimmer 1.3s var(--ease) infinite;border-radius:var(--r-sm);border:1px solid var(--border)}
.sk.h34{height:34px} .sk.h72{height:72px} .sk.h120{height:120px} .sk.h200{height:200px}
.sk.w40{width:40%} .sk.w60{width:60%} .sk.w80{width:80%}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.state-box{
  border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg-card);
  padding:26px 20px;text-align:center;max-width:620px;
}
.state-box .ic{width:30px;height:30px;margin:0 auto 10px;display:grid;place-items:center;border-radius:50%;
  background:var(--bg-main);border:1px solid var(--border-strong)}
.state-box .ic .icon{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.state-box h3{margin:0 0 4px;font-size:13.5px}
.state-box p{margin:0 auto;font-size:12px;color:var(--text-muted);max-width:440px;line-height:1.6}
.state-box .btn{margin-top:14px}
.state-box.err{border-color:rgba(224,85,85,.28);background:linear-gradient(180deg,var(--red-bg),var(--bg-card))}
.state-box.err .ic{color:var(--red);border-color:rgba(224,85,85,.35)}
.state-box.empty .ic{color:var(--text-muted)}
.callout{
  border:1px solid var(--border);border-left:3px solid var(--blue);background:var(--bg-card);
  border-radius:var(--r-sm);padding:10px 13px;margin:12px 0 0;font-size:12px;color:var(--text-secondary);line-height:1.6;
}
.callout.warn{border-left-color:var(--orange)} .callout.bad{border-left-color:var(--red)}
.callout.ok{border-left-color:var(--green)}
.callout p{margin:0}
.callout b{color:var(--text)}

.bar{height:5px;border-radius:3px;background:var(--bg-input);overflow:hidden;min-width:50px}
.bar i{display:block;height:100%;background:var(--blue)}
.bar i.g{background:var(--green)} .bar i.o{background:var(--orange)} .bar i.r{background:var(--red)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12px;margin:0}
.kv dt{color:var(--text-muted);white-space:nowrap}
.kv dd{margin:0;color:var(--text);font-family:var(--font-mono);font-size:11.5px;overflow-wrap:anywhere}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dot.ok{background:var(--green)} .dot.warn{background:var(--orange)} .dot.bad{background:var(--red)}

/* ---------- 文本层级：可读性 = AA ----------
   三级文字：--text(正文) > --text-secondary(次要) > --text-faint(信息型弱化文字)。
   --text-muted 只留给装饰（图标/分隔符/禁用/占位），不承载信息，因此可以低于 4.5:1。
   以下覆盖把「承载信息的小字」统一提到 --text-faint（各背景 >= 4.6:1）。 */
:root{
  --text-secondary:#a3a7ae;
  --text-faint:#878c96;
  /* 语义色在文字上的可读版本（红/蓝原色在深底上 <4.5:1）；边框与圆点仍用原色。 */
  --red-text:#ea7676;
  --blue-text:#8ab2f8;
  /* 实心按钮底色：品牌蓝 #548cf0 上的白字只有 3.3:1，实心填充下沉到 4.8:1；
     品牌蓝本身继续用于链接/强调/图标（在深底上对比充足）。 */
  --blue-solid:#3f6fd0;
  --blue-solid-hover:#3a68c8;
}
.chip.bad,.btn.danger{color:var(--red-text)}
.kpi.bad .v{color:var(--red-text)}
.pop .item[aria-checked="true"]{color:var(--blue-text)}
.btn.primary{background:var(--blue-solid);border-color:var(--blue-solid)}
.btn.primary:hover{background:var(--blue-solid-hover);border-color:var(--blue-solid-hover)}
.nav-grp,.side-brand .env,.side-foot,.nav-item .count,.crumb .sep,.crumb .dim,
.eyebrow,.note,.panel-head .sub,.kpi .k,.kpi .s,
table.tbl th,table.tbl tr.empty-row td,table.tbl tr.grp td,
.tl-item .t,.stage-head .count,.stage>p.hint,.cand .meta,.tree-row .desc,
.tab,.kv dt,.entry .lesson,.empty-soft,.state-box p,.pop .item .k,.dim,
.search input::placeholder{color:var(--text-faint)}
.side-brand i{color:#0b0c10}      /* 5.9:1 on --blue */
.app-brand i{color:#0b0c10}

/* ---------- 响应式 ---------- */
@media (max-width:1240px){
  .ev-grid{grid-template-columns:226px minmax(0,1fr)}
  .ev-grid .ev-side{grid-column:1 / -1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
  .kpis.six{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:1080px){
  .kpis,.kpis.six{grid-template-columns:repeat(3,minmax(0,1fr))}
  .two-col,.two-col.even,.lib-grid,.g3{grid-template-columns:minmax(0,1fr)}
  .pipe{grid-template-columns:repeat(2,minmax(220px,1fr))}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{
    position:fixed;left:0;top:0;bottom:0;width:min(84vw,280px);transform:translateX(-102%);
    transition:transform var(--normal) var(--ease);box-shadow:20px 0 50px rgba(0,0,0,.5);
  }
  .app.side-open .side{transform:none}
  .topbar .icon-btn{display:inline-grid}
  .crumb .dim{display:none}
  .content{padding:14px 14px 48px}
  .ev-grid{grid-template-columns:minmax(0,1fr)}
  .ev-grid .ev-side{grid-template-columns:minmax(0,1fr)}
  .kpis,.kpis.six{grid-template-columns:repeat(2,minmax(0,1fr))}
  .view-head{flex-wrap:wrap}
  .view-head .actions{justify-content:flex-start}
}
@media (max-width:620px){
  .pipe{grid-template-columns:minmax(0,1fr)}
  .top-actions{gap:5px}
  .top-actions .hide-sm{display:none}
  #top-actions [data-act="state-pop"] .lbl{display:none}
  #top-actions [data-act="export-report"]{display:none}
  .search{min-width:130px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  html{scroll-behavior:auto}
}
</style>

<script>
"use strict";
/* ============================================================
   2. 运行状态 + 小工具
   ============================================================ */
const S = {
  view: "workbench",
  demo: "normal",          // normal | loading | empty | error
  collapsed: false,
  taskQuery: "",
  domainFilter: "all",
  runTask: "ledger-1",
  evTab: "traj",
  evFile: "rollouts/base1.md",
  libDomain: "accounting",
  libEntry: "ledger-1",
  reportMode: "refined",
  autoRefresh: true,
  pendingSync: false,
  pop: null
};
let liveES = null;

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icon = (id, cls = "icon") => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const chip = (tone, text) => `<span class="chip ${tone || ""}">${esc(text)}</span>`;
const now = () => new Date().toLocaleTimeString("zh-CN", { hour12: false });

function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("on"), 2600);
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    toast("已复制到剪贴板");
  } catch (_) {
    toast("复制失败：浏览器拒绝了剪贴板访问");
  }
}

function download(name, text, mime = "text/plain;charset=utf-8") {
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast(`已导出 ${name}（演示数据）`);
}

/* ---------- 覆盖层 ---------- */
function openDrawer(title, chipTone, chipText, body) {
  $("#drawer-title").textContent = title;
  $("#drawer-chip").innerHTML = chipTone === null ? "" : chip(chipTone, chipText);
  $("#drawer-body").innerHTML = body;
  $("#mask").classList.add("on");
  const d = $("#drawer");
  d.classList.add("on");
  d.setAttribute("aria-hidden", "false");
  d.querySelector("[data-close]").focus({ preventScroll: true });
}
function closeOverlays() {
  $("#mask").classList.remove("on");
  ["#drawer", "#modal"].forEach((sel) => {
    const el = $(sel);
    el.classList.remove("on");
    el.setAttribute("aria-hidden", "true");
  });
  closePop();
}
function openModal({ title, body, confirm, danger, onConfirm }) {
  $("#modal-title").textContent = title;
  $("#modal-body").innerHTML = body;
  const foot = $("#modal-foot");
  foot.innerHTML = `<button class="btn sm" data-close>取消</button>
    <button class="btn sm ${danger ? "danger" : "primary"}" id="modal-ok">${esc(confirm)}</button>`;
  $("#modal-ok").onclick = () => { closeOverlays(); onConfirm && onConfirm(); };
  $("#mask").classList.add("on");
  const m = $("#modal");
  m.classList.add("on");
  m.setAttribute("aria-hidden", "false");
  $("#modal-ok").focus({ preventScroll: true });
}

function openPop(anchor, items) {
  const pop = $("#pop");
  pop.innerHTML = items.map((it) => it === "-" ? '<div class="sep"></div>'
    : `<button class="item" role="menuitemradio" aria-checked="${!!it.on}" data-pop-pick="${esc(it.key)}">
         ${it.icon || ""}<span>${it.label}</span>${it.hint ? `<span class="k">${esc(it.hint)}</span>` : ""}
       </button>`).join("");
  pop.classList.add("on");
  pop.setAttribute("aria-hidden", "false");
  const r = anchor.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + "px";
  pop.style.top = (r.bottom + 6 + h > innerHeight - 8 ? Math.max(8, r.top - h - 6) : r.bottom + 6) + "px";
  anchor.setAttribute("aria-expanded", "true");
  S.pop = { items, anchor };
  const first = pop.querySelector(".item");
  if (first) first.focus({ preventScroll: true });
}
function closePop() {
  const was = S.pop;
  $("#pop").classList.remove("on");
  $("#pop").setAttribute("aria-hidden", "true");
  if (was && was.anchor) {
    was.anchor.setAttribute("aria-expanded", "false");
    if (document.activeElement && document.activeElement.closest("#pop")) was.anchor.focus({ preventScroll: true });
  }
  S.pop = null;
}

/* ============================================================
   6. 视图：流水线
   ============================================================ */
function candCard(c, stage) {
  const probe = c.probe ? `<div class="probe">probe <span class="v ${c.probe.tone}">${esc(c.probe.v)}</span>
      <span class="dim tiny">${esc(c.probe.note)}</span></div>` : "";
  const meta = (c.meta || []).map((m) => `<span>${esc(m)}</span>`).join("");
  return `<div class="cand ${c.tone}" data-act="cand" data-label="${esc(c.label)}" tabindex="0" role="button"
       aria-label="查看候选 ${esc(c.label)} 的 diff 与校验">
    <div class="cand-top">
      <span class="label">${esc(c.label)}</span>
      <span class="spacer"></span>
      ${chip(c.chip[0], c.chip[1])}
    </div>
    <p>${esc(c.body)}</p>
    ${probe}
    <div class="meta">${meta}</div>
  </div>`;
}

function renderPipeline() {
  const stages = [
    { n: "①", title: "Base", hint: "基线不是 1 个样本：k 次重复让「2/2 都错」和「1/2 偶发」在证据上可分。", cards: PIPE.base },
    { n: "②", title: "Propose", hint: "2k 个候选并发；提案只输出改动文件，省略即继承。", cards: PIPE.propose },
    { n: "③", title: "Probe", hint: "每个候选真跑 1 次：一次好/坏都是弱证据，必须点名轨迹里的机制。", cards: PIPE.probe },
    { n: "④", title: "Compose", hint: "合成器是最后一道闸：不能把被证据否掉的改动「洗」进终版。", cards: PIPE.compose }
  ];
  const cols = stages.map((st) => `<section class="stage">
    <div class="stage-head"><span class="n">${st.n}</span><h4>${st.title}</h4>
      <span class="count">${st.cards.length}</span></div>
    <p class="hint">${st.hint}</p>
    ${st.cards.map((c) => candCard(c, st.title)).join("")}
  </section>`).join("");

  const choices = PIPE.composeChoices;
  const choiceRow = `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
      ${chip("ok", `kept ${choices.kept.join(" · ")}`)}
      ${chip("", `revised ${choices.revised.length ? choices.revised.join(" · ") : "—"}`)}
      ${chip("bad", `dropped ${choices.dropped.join(" · ")}`)}
    </div>
    <p class="small" style="margin:0">合成器逐条写出 kept / revised / dropped；<b>被证据否掉的改动不能静默复活</b>。</p>`;

  const rejections = RUN_DETAIL.rejections.map((r) => `<li style="margin:0 0 8px"><span class="mono tiny" style="color:var(--red-text)">${esc(r)}</span></li>`).join("");

  return `<div class="wrap">${head(
    "流水线 · Propose–Probe–Compose",
    "四列就是一次任务的全部动作：2 个基线、2k 个候选提案、每个候选 1 次 probe、k 个合成终版。点任意候选看它的 diff 与校验结论。",
    `${LIVE ? "" : chip("info", "确定性 demo 编辑者")}<button class="btn sm" data-act="export-pipe">${icon("i-download")}导出</button>`
  )}
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
    ${chip("info", PIPE.taskLabel || "—")}${chip("", `${RUN.mode} · k=${RUN.k}`)}
    ${chip("", `${PIPE.rolloutCount || 0} 次 rollout（ledger 口径）`)}
    <span class="spacer" style="flex:1"></span>${chip("mono", "编辑契约：省略即继承")}
  </div>
  <div class="pipe">${cols}</div>
  <div class="two-col" style="margin-top:14px">
    ${panel("合成决策（decisions/agg1.md）", chip("ok", "adopted agg1"), choiceRow)}
    ${panel("校验器在合成之前就把废案扔掉了", chip("mono", "tree.validate"),
      `<ul style="list-style:none;margin:0;padding:0">${rejections}</ul>
       <p class="note">被拒 → 反馈原文原样回灌 → 重试一次（<span class="mono">STAGE_ATTEMPTS=2</span>）→
       仍失败则回退到当前 harness 并记 <span class="mono">fell_back</span>。越界文件不是静默丢弃，而是整棵提案作废。</p>`)}
  </div>
  <p class="note">可点区：候选卡片 → 右侧抽屉（diff / notes / 五项校验）· 导出 → 候选摘要 JSON。
    真实运行里列宽不固定：并行模式 2k 个候选并发，串行模式每轮只有 2 个候选 + 1 个 checkpoint。</p>
  </div>`;
}

function openCandidate(label) {
  const all = [...PIPE.propose, ...PIPE.compose];
  const c = all.find((x) => x.label === label);
  if (!c) {
    const probe = PIPE.probe.find((p) => p.label === label);
    if (probe) {
      openDrawer(`候选 ${label}`, probe.chip[0], probe.chip[1], `
        <p class="small muted">这一步只记录 probe 结果，diff 在 ② Propose 的同一 label 里。</p>
        <div class="callout ${probe.tone === "bad" ? "bad" : probe.tone === "warn" ? "warn" : "ok"}">
          <p><b>probe：${esc(probe.chip[1])}</b> — ${esc(probe.body)}</p></div>
        <p class="note">${(probe.meta || []).map(esc).join(" · ")}</p>`);
    }
    return;
  }
  const isCompose = !!c.detail;
  const body = `
    ${isCompose ? `<div class="callout ok"><p><b>合成终版</b>：${esc(c.body)}</p></div>
      <p class="eyebrow" style="margin-top:14px">决策</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${chip("ok", "kept inv1 · inv2")}${chip("bad", "dropped dom1 · dom2")}</div>
      <p class="note">similarity 1.00：与 agg1 同树，故只作 runner-up，不重复计一次提升。</p>`
    : `<p class="eyebrow">diff</p><pre class="diff">${(c.diff || []).map((l) => {
        const cls = l.startsWith("+") && !l.startsWith("+++") ? "add" : l.startsWith("-") && !l.startsWith("---") ? "del" : l.startsWith("@@") ? "hunk" : "";
        return cls ? `<span class="${cls}">${esc(l)}</span>` : esc(l);
      }).join("\n")}</pre>
      <p class="eyebrow" style="margin-top:14px">notes（进 decisions/，供合成器与反思读）</p>
      <pre class="code">${esc(c.notes || "—")}</pre>
      <p class="eyebrow" style="margin-top:14px">校验结论</p>
      <div class="table-wrap"><table class="tbl"><tbody>${(c.checks || []).map(([k, v, tone]) => `
        <tr><td class="dim">${esc(k)}</td><td style="text-align:right">${chip(tone, v)}</td></tr>`).join("")}</tbody></table></div>
      <p class="eyebrow" style="margin-top:14px">改动文件</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${(c.files || []).map((f) => `<span class="pill mono">${esc(f)}</span>`).join("")}</div>`}`;
  openDrawer(`候选 ${c.label}`, c.chip[0], c.chip[1], body);
}

/* ---------- 后端模式（harness2-console / --export） ----------
   页面默认是演示数据；如果由 harness2-console 提供，或 HTML 里带了 window.__H2_DATA__，
   就用磁盘上的真实 run 覆盖整份模型。缺失的产物不会被补成数字。 */
let LIVE = false, META = null;

async function loadLive(focus, task) {
  try {
    let model = window.__H2_DATA__;
    if (!model && location.protocol !== "file:") {
      const qs = [];
      if (focus) qs.push(`focus=${encodeURIComponent(focus)}`);
      if (task) qs.push(`task=${encodeURIComponent(task)}`);
      const res = await fetch("api/state" + (qs.length ? "?" + qs.join("&") : ""), { cache: "no-store" });
      if (res.ok) model = await res.json();
    }
    if (!model || !model.run) return false;
    RUN = model.run; DOMAINS = model.domains || []; TASKS = model.tasks || [];
    EVENTS = model.events || []; RUN_DETAIL = model.run_detail;
    PIPE = model.pipe; EVIDENCE = model.evidence; LIBRARY = model.library;
    LEDGER = model.ledger; REPORT = model.report || REPORT;
    META = model.meta || {}; LIVE = true;
    S.pendingSync = false;
    S.runTask = (RUN_DETAIL && RUN_DETAIL.id) || (TASKS[0] && TASKS[0].id) || "";
    S.libDomain = (LIBRARY.domains[0] || {}).id || "";
    const entries = LIBRARY.entries[S.libDomain] || [];
    S.libEntry = (entries[0] || {}).id || "";
    S.evTab = (EVIDENCE.tabs[0] || {}).id || "traj";
    S.evFile = ((EVIDENCE.tabs[0] || {}).files || [])[0] || "";
    S.taskQuery = "";
    return true;
  } catch (e) {
    return false;
  }
}

function applyChrome() {
  const badge = $("#live-badge");
  if (!badge) return;
  if (LIVE) {
    badge.hidden = true;  // real runs need no banner; the footer still names the run
    const foot = $(".side-foot");
    if (foot) foot.innerHTML = `<span class="dot" aria-hidden="true"></span><span>substrate <b>${esc(RUN.substrate)}</b> · ${esc(RUN.namespace)}</span>`;
  }
}

async function switchRun(ns) {
  const ok = await loadLive(ns);
  applyChrome();
  render();
  if (ok) connectLive();
  toast(ok ? `已切到 ${ns}（真实 run）` : `读取 ${ns} 失败`);
}

async function switchTask(id) {
  const ok = await loadLive(RUN.namespace, id);
  if (ok) {
    S.runTask = id;
    applyChrome();
    go("run/" + encodeURIComponent(id));
    toast(`已打开 ${id} 的真实证据`);
  } else {
    toast(`读取 ${id} 失败：保留当前任务`);
  }
}

/* ---------- 实时读取：SSE（/api/events）+ 304 轮询兜底 ---------- */
function overlayOpen() {
  return $("#drawer").classList.contains("on") || $("#modal").classList.contains("on");
}
function isTyping() {
  const a = document.activeElement;
  return !!a && ["INPUT", "TEXTAREA", "SELECT"].includes(a.tagName);
}
function markPending() {
  S.pendingSync = true;
  renderTopActions();
}
async function syncNow() {
  const ok = await loadLive(META && META.focus);
  S.pendingSync = false;
  if (ok) {
    applyChrome();
    render();
    applyRoute();
    toast("已同步新数据（读盘）");
  } else {
    markPending();
    toast("同步失败：保留上一份数据");
  }
}
async function onRevision(rev) {
  if (rev && META && rev === META.revision) return;
  if (!S.autoRefresh || overlayOpen() || isTyping()) { markPending(); return; }
  const ok = await loadLive(META && META.focus);
  if (ok) { applyChrome(); render(); toast("检测到新数据，已同步"); }
  else markPending();
}
async function pollOnce() {
  if (!LIVE || !S.autoRefresh) return;
  try {
    const res = await fetch("api/state", { cache: "no-store" });
    if (!res.ok) return;
    const model = await res.json();
    onRevision(model.meta && model.meta.revision);
  } catch (_) { /* keep the last good model */ }
}
function connectLive() {
  if (location.protocol === "file:") return;
  if (!window.EventSource) {
    if (!connectLive._poll) connectLive._poll = setInterval(pollOnce, 5000);
    return;
  }
  if (liveES) liveES.close();
  liveES = new EventSource("api/events");
  liveES.addEventListener("ready", (e) => {
    try { META.revision = JSON.parse(e.data).revision; } catch (_) {}
  });
  liveES.addEventListener("change", (e) => {
    let rev = null;
    try { rev = JSON.parse(e.data).revision; } catch (_) {}
    onRevision(rev);
  });
  liveES.onerror = () => { /* EventSource reconnects by itself */ };
}
function readStamp() {
  if (!META) return "";
  return META.read_at || META.generated_at || "";
}

/* ---------- 实时活动：harness2 此刻在写什么（后端 /api/activity） ---------- */

  }
}
function startActivityTicker() {
  if (startActivityTicker._on) return;
  startActivityTicker._on = true;
  actTimer = setInterval(async () => {
    if (!LIVE) return;
    const ok = await loadActivity();
    if (!ok) return;
    if (S.view === "activity" && !overlayOpen() && !isTyping()) render();
    else if (!overlayOpen()) renderTopActions();
  }, 5000);
}
function fmtAge(sec) {
  const n = Number(sec) || 0;
  if (n < 60) return `${n}s 前`;
  if (n < 3600) return `${Math.round(n / 60)}m 前`;
  return `${Math.round(n / 3600)}h 前`;
}

function renderSettings() {
  if (!LIVE) {
    return `<div class="wrap">${head("配置与状态", "配置页需要后端；直接打开 HTML 时没有服务可读。", "")}
      ${stateBox("empty", "没有后端可读", "用 <span class=\"mono\">harness2-console --runs runs --port 8099</span> 打开本页，即可看到服务端、数据源、可用 CLI 与环境变量。", { act: "config-refresh", label: "重试" })}
    </div>`;
  }
  if (!CONFIG) {
    return `<div class="wrap">${head("配置与状态", "正在读取服务端配置…", "")}${skeleton()}</div>`;
  }
  const srv = CONFIG.server || {}, roots = CONFIG.roots || [], exes = CONFIG.executables || {};
  const found = Object.values(exes).filter(Boolean).length;
  const env = Object.entries(CONFIG.env || {});
  const rootRows = roots.map((r) => `<tr><td class="mono tiny">${esc(r.path)}</td>
      <td>${r.exists ? chip("ok", "存在") : chip("bad", "缺失")}</td></tr>`).join("");
  const exeRows = Object.entries(exes).map(([name, path]) => `<tr>
      <td class="mono tiny">${esc(name)}</td>
      <td>${path ? chip("ok", "在 PATH") : chip("", "未找到")}</td>
      <td class="mono tiny dim" style="overflow-wrap:anywhere">${esc(path || "—")}</td></tr>`).join("");
  const envRows = env.length ? env.map(([k, v]) => `<tr>
      <td class="mono tiny">${esc(k)}</td><td class="mono tiny">${esc(v)}</td></tr>`).join("")
    : `<tr class="empty-row"><td colspan="2">进程环境里没有 HARNESS2_* 变量</td></tr>`;
  const endpointRows = (CONFIG.endpoints || []).map(([p, d]) => `<tr>
      <td class="mono tiny">${esc(p)}</td><td class="small">${esc(d)}</td></tr>`).join("");

  return `<div class="wrap">${head(
    "配置与状态",
    "这个后端服务在服务谁、读哪些目录、机器上哪些 CLI 可用、进程里有哪些 HARNESS2_* 变量（密钥打码）。",
    `<button class="btn sm" data-act="config-refresh">${icon("i-refresh")}重新读取</button>`
  )}
  ${kpiRow([
    { k: "数据源", v: String(roots.length), s: roots.filter((r) => r.exists).length + " 个存在" },
    { k: "可用 CLI", v: `${found} / ${Object.keys(exes).length}`, s: "harness2 / 执行器二进制", tone: found ? "good" : "warn" },
    { k: "HARNESS2_* 变量", v: String(env.length), s: "启动本服务的环境" },
    { k: "服务", v: `${esc(srv.bind)}:${esc(String(srv.port))}`, s: "无写路径" }
  ])}
  <div class="two-col">
    <div class="stack">
      ${panel("服务端", chip("mono", "harness2-console"), `<dl class="kv">
        <dt>Python</dt><dd>${esc(srv.python || "—")}</dd>
        <dt>监听</dt><dd>${esc(srv.bind)}:${esc(String(srv.port))}</dd>
        <dt>页面文件</dt><dd>${esc(srv.page)} ${srv.page_exists ? chip("ok", "存在") : chip("bad", "缺失")}</dd>
        <dt>写操作</dt><dd>POST → 405；没有任意文件接口</dd>
        <dt>复跑执行</dt><dd>${srv.allow_run ? chip("warn", "已开启：POST /api/rerun 会在本机执行命令") : chip("", "关闭：只生成命令（启动加 --allow-run 可执行）")}</dd>
      </dl>`)}
      ${panel("数据源目录", chip("mono", `${roots.length} 个`),
        table([{ label: "目录" }, { label: "状态" }], rootRows || `<tr class="empty-row"><td colspan="2">没有 --runs</td></tr>`))}
      ${panel("接口", "", table([{ label: "接口" }, { label: "用途" }], endpointRows))}
    </div>
    <div class="stack">
      ${panel("执行器与工具", chip("mono", `${found} 在 PATH`),
        table([{ label: "名称" }, { label: "状态" }, { label: "路径" }], exeRows))}
      ${panel("环境变量", "", table([{ label: "变量" }, { label: "值" }], envRows))}
      ${panel("安全与网络", "", `<ul class="checklist no">
        <li>${icon("i-shield")}<span>默认只绑 <span class="mono">127.0.0.1</span>；没有鉴权，因为不写数据</span></li>
        <li>${icon("i-shield")}<span>路由：GET /、/api/*、/healthz；POST 一律 405</span></li>
        <li>${icon("i-shield")}<span>不提供任意文件读取：模型自带需要展示的文本</span></li>
        <li>${icon("i-info")}<span>执行器的网络访问由 harness2 自己控制（见 docs/EXPERIMENTS.md#web-access）</span></li>
      </ul>`)}
    </div>
  </div>
  <p class="note">这页对应产品设计里「配置」导航：原型阶段是占位，现在读的是后端真实配置。</p>
  </div>`;
}

/* ---------- 路由 ---------- */
function routeFromHash() {
  const raw = location.hash.replace(/^#\/?/, "");
  const [seg, ...rest] = raw.split("/");
  if (!seg) return { view: "workbench" };
  if (seg === "stub") return { view: "stub", stub: rest[0] };
  if (VIEW_META[seg]) {
    if (seg === "run" && rest[0]) S.runTask = decodeURIComponent(rest[0]);
    if (seg === "library" && rest[0]) S.libDomain = decodeURIComponent(rest[0]);
    if (seg === "evidence" && rest[0]) S.evTab = decodeURIComponent(rest[0]);
    return { view: seg };
  }
  return { view: "workbench" };
}
function applyRoute() {
  const r = routeFromHash();
  if (r.view === "stub") {
    toast(r.stub === "stub-exec" ? "执行器与模型：不在本版原型范围（演示）" : "安全与网络：不在本版原型范围（演示）");
    location.hash = "#/" + S.view;
    return;
  }
  S.view = r.view;
  if (r.view === "activity" && LIVE && !ACT) {
    loadActivity().then(() => { if (S.view === "activity") render(); });
  }
  if (r.view === "settings" && LIVE && !CONFIG) {
    loadConfig().then(() => { if (S.view === "settings") render(); });
  }
  $(".app").classList.remove("side-open");
  const mb = $("#menu-btn");
  if (mb) mb.setAttribute("aria-expanded", "false");
  render();
  $("#content").scrollTop = 0;
}
function go(path) {
  if (location.hash === "#/" + path) applyRoute();
  else location.hash = "#/" + path;
}
</script>
<script>
"use strict";
/* ============================================================
   12. 交互：事件委托、快捷键、导出
   ============================================================ */
const REPRO = `# demo 宇宙不需要模型凭据：这条命令重放整条链路
harness2-demo --output runs/demo --k 2`;

function toCsv(header, rows) {
  const q = (v) => `"${String(v).replace(/"/g, '""')}"`;
  return [header, ...rows].map((r) => r.map(q).join(",")).join("\r\n") + "\r\n";
}

function setDemo(kind) {
  S.demo = kind;
  closePop();
  render();
  if (kind === "loading") {
    clearTimeout(setDemo._t);
    setDemo._t = setTimeout(() => {
      S.demo = "normal";
      render();
      toast("加载完成（演示）");
    }, 900);
  } else if (kind !== "normal") {
    toast(`已切到「${stateLabel()}」态（演示）`);
  }
}

async function refreshView() {
  S.demo = "loading";
  render();
  if (LIVE) {
    const ok = await loadLive(META && META.focus);
    S.demo = "normal";
    applyChrome();
    render();
    applyRoute();
    toast(ok ? "已刷新：重新读取 runs 目录" : "刷新失败：保留上一份数据");
    return;
  }
  clearTimeout(refreshView._t);
  refreshView._t = setTimeout(() => {
    S.demo = "normal";
    render();
    toast("已刷新（演示）");
  }, 620);
}

const ACTIONS = {
  refresh: () => refreshView(),
  "state-pop": (el) => S.pop && S.pop.anchor === el ? closePop() : openPop(el, [
    { key: "normal", label: "正常", hint: "内容", on: S.demo === "normal" },
    { key: "loading", label: "加载中", hint: "骨架", on: S.demo === "loading" },
    { key: "empty", label: "空", hint: "空态", on: S.demo === "empty" },
    { key: "error", label: "错误", hint: "错误态", on: S.demo === "error" },
    "-",
    { key: "shortcuts", label: "键盘快捷键", hint: "?", icon: icon("i-info") }
  ]),
  "state-normal": () => setDemo("normal"),
  "auto-refresh": () => {
    S.autoRefresh = !S.autoRefresh;
    if (S.autoRefresh && S.pendingSync) { syncNow(); return; }
    renderTopActions();
    toast(S.autoRefresh ? "自动同步已开：/api/events 推送变更" : "自动同步已关：手动刷新或点「有新数据」");
  },
  "sync-now": () => syncNow(),
  "activity-refresh": () => loadActivity().then((ok) => { render(); toast(ok ? "已刷新活动" : "读取失败：保留上一份"); }),
  "config-refresh": () => loadConfig().then((ok) => { render(); toast(ok ? "已重新读取配置" : "读取失败"); }),
  "new-run": () => LIVE ? toast("新建 run 请运行 harness2 命令") : openModal({
    title: "新建 run",
    body: `真实系统里这一步是一个表单（基准 / 执行器 / 模式 / k / 领域抽样）。本版原型只演示控制台形态，
      表单不在范围内。<br><br>提示：<span class="mono">harness2 --bench lab --k 2 --mode parallel</span>`,
    confirm: "知道了",
    onConfirm: () => toast("表单不在本版原型范围（演示）")
  }),
  "open-run": (el) => go("run/" + el.dataset.id),
  "domain-filter": (el) => { S.domainFilter = el.dataset.k; render(); },
  "clear-task-query": () => { S.taskQuery = ""; render(); },
  "copy-repro": () => copyText(LIVE
    ? `# ${RUN.namespace} · ${RUN.bench}/${RUN.substrate} · ${RUN.mode} k=${RUN.k}\n`
      + `# 打开同一份数据的控制台：\nharness2-console`
      + (META.roots || []).map((r) => ` --runs ${r}`).join("")
      + ` --focus ${RUN.namespace}`
    : REPRO),
  "copy-dir": () => copyText("context/"),
  "copy-commands": () => copyText(REPORT.commands),
  rerun: async () => {
    if (!LIVE) {
      openModal({
        title: "重跑 ledger-1？",
        body: `重跑会复用缓存指纹：已完成的 rollout / session 命中缓存时 <span class="mono">attempts=0</span>、不重复计费。
          <br><br>破坏性动作需要二次确认，这是有意的。`,
        confirm: "确认重跑",
        danger: true,
        onConfirm: () => toast("已排入重跑队列（演示）")
      });
      return;
    }
    let plan;
    try {
      const res = await fetch(`api/rerun?run=${encodeURIComponent(RUN.namespace)}&task=${encodeURIComponent(S.runTask)}`);
      plan = await res.json().catch(() => ({}));
      if (!res.ok) {
        const raw = plan.error || "";
        toast(raw && !raw.includes("not found") ? raw : "后端未就绪：重启 harness2-console 后刷新页面");
        return;
      }
    } catch (_) {
      toast("生成复跑命令失败");
      return;
    }
    openModal({
      title: `重跑 ${S.runTask}`,
      body: `<p>沿用同一次 run 的 namespace / k / mode；缓存指纹命中时不会重复计费。</p>
        <pre class="code">${esc(plan.command)}</pre>
        <p class="tiny dim">${esc(plan.note || "")}</p>
        ${plan.allow_run ? "" : `<p class="tiny dim">服务端没开 <span class="mono">--allow-run</span>：这里只生成命令，可复制后自己执行。</p>`}`,
      confirm: plan.allow_run ? "在本机执行" : "复制命令",
      danger: !!plan.allow_run,
      onConfirm: async () => {
        if (!plan.allow_run) { await copyText(plan.command); return; }
        try {
          const res = await fetch("api/rerun", { method: "POST", headers: { "content-type": "application/json" },
            body: JSON.stringify({ run: RUN.namespace, task: S.runTask }) });
          const data = await res.json();
          if (!res.ok) { toast(data.error || "启动失败"); return; }
          toast(`已启动 pid ${data.pid}，日志 ${data.log}`);
          loadActivity().then(() => renderTopActions());
        } catch (_) { toast("启动失败"); }
      }
    });
  },
  cand: (el) => openCandidate(el.dataset.label),
  "export-pipe": () => download("harness2-pipeline-demo.json", JSON.stringify({
    task: "ledger-1", stage_attempts: 2, stages: { base: PIPE.base, propose: PIPE.propose, probe: PIPE.probe, compose: PIPE.compose }
  }, null, 2), "application/json"),
  "ev-tab": (el) => {
    S.evTab = el.dataset.k;
    const tab = EVIDENCE.tabs.find((t) => t.id === S.evTab);
    S.evFile = tab.files[0];
    render();
  },
  "ev-file": (el) => { S.evFile = el.dataset.file; render(); },
  "ev-node": (el) => {
    const node = EVIDENCE.tree.find((n) => n.name === el.dataset.node);
    if (!node) return;
    if (node.dir) { node.open = node.open === false; render(); }
    else if (node.file) { S.evFile = node.file; render(); }
  },
  "lib-domain": (el) => { S.libDomain = el.dataset.k; S.libEntry = ""; render(); },
  "lib-entry": (el) => { S.libEntry = el.dataset.k; render(); },
  "rebuild-lib": () => toast(LIVE ? "library 索引由 harness2 写入" : "索引已从磁盘重建（演示：不写真实文件）"),
  "export-ledger": () => download("harness2-ledger-demo.csv",
    toCsv(["kind", "label", "attempts", "cached", "usd"], LEDGER.rows)),
  "export-report": () => download("harness2-report-demo.csv",
    toCsv(["bench", "base", "refined", "delta", "basis"], REPORT.table.map((r) => [r.name, r.base, r.refined, r.delta, r.basis]))),
  "report-mode": (el) => { S.reportMode = el.dataset.k; render(); }
};

document.addEventListener("click", (e) => {
  const closer = e.target.closest("[data-close]");
  if (closer) { closeOverlays(); return; }
  if (e.target.id === "mask") { closeOverlays(); return; }

  const pick = e.target.closest("[data-pop-pick]");
  if (pick) {
    const key = pick.dataset.popPick;
    if (key === "shortcuts") { closePop(); showShortcuts(); } else setDemo(key);
    return;
  }
  if (!e.target.closest("#pop") && !e.target.closest('[data-act="state-pop"]')) closePop();

  const stub = e.target.closest("[data-stub]");
  if (stub) {
    e.preventDefault();
    toast(stub.dataset.stub === "stub-exec" ? "执行器与模型：不在本版原型范围（演示）" : "安全与网络：不在本版原型范围（演示）");
    return;
  }
  const a = e.target.closest("[data-act]");
  if (a && ACTIONS[a.dataset.act]) {
    e.preventDefault();
    ACTIONS[a.dataset.act](a);
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeOverlays(); return; }
  const actEl = e.target.closest && e.target.closest('[data-act][role="button"]');
  if (actEl && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault();
    if (ACTIONS[actEl.dataset.act]) ACTIONS[actEl.dataset.act](actEl);
    return;
  }
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || tag === "select";
  if (typing) return;

  if (e.key === "?") { e.preventDefault(); showShortcuts(); return; }
  if (e.key === "/") {
    const input = $("#task-search");
    if (input) { e.preventDefault(); input.focus(); input.select(); }
    return;
  }
  if (e.key === "[") { e.preventDefault(); toggleSidebar(); return; }
  if (e.key === "r") { e.preventDefault(); refreshView(); return; }
  if (e.key === "g") { e.preventDefault(); keyBuffer = "g"; setTimeout(() => { keyBuffer = ""; }, 1400); return; }
  if (keyBuffer === "g" && /^[1-7]$/.test(e.key)) {
    const id = NAV.slice(0, 2).flatMap((g) => g.items).filter((i) => !i.stub)[Number(e.key) - 1];
    keyBuffer = "";
    if (id) go(id.id);
  }
});
let keyBuffer = "";

document.addEventListener("input", (e) => {
  if (e.target.id === "task-search") {
    S.taskQuery = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const input = $("#task-search");
    if (input) { input.focus(); input.setSelectionRange(pos, pos); }
  }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "task-switch") switchTask(e.target.value);
  if (e.target.id === "run-switch") switchRun(e.target.value);
});

function showShortcuts() {
  openModal({
    title: "键盘快捷键",
    body: `<div class="table-wrap"><table class="tbl compact"><tbody>
      <tr><td><span class="kbd">g</span> <span class="kbd">1</span>–<span class="kbd">7</span></td><td>跳到第 1–7 个页面</td></tr>
      <tr><td><span class="kbd">/</span></td><td>聚焦筛选框</td></tr>
      <tr><td><span class="kbd">r</span></td><td>刷新当前视图（骨架 → 内容）</td></tr>
      <tr><td><span class="kbd">[</span></td><td>收起 / 展开侧栏</td></tr>
      <tr><td><span class="kbd">Esc</span></td><td>关闭抽屉 / 弹层</td></tr>
      <tr><td><span class="kbd">?</span></td><td>本对话框</td></tr>
    </tbody></table></div>`,
    confirm: "知道了"
  });
}

function toggleSidebar() {
  if (innerWidth <= 860) {
    const app = $(".app");
    app.classList.toggle("side-open");
    $("#menu-btn").setAttribute("aria-expanded", String(app.classList.contains("side-open")));
  } else {
    S.collapsed = !S.collapsed;
    $(".app").classList.toggle("side-collapsed", S.collapsed);
  }
}

/* ---------- 启动 ---------- */
$("#menu-btn").addEventListener("click", toggleSidebar);
window.addEventListener("hashchange", applyRoute);
window.addEventListener("resize", () => {
  if (innerWidth > 860) $(".app").classList.remove("side-open");
  closePop();
});
(async () => {
  if (location.protocol !== "file:") {
    S.demo = "loading";
    render();
  }
  const ok = await loadLive();
  S.demo = "normal";
  applyChrome();
  applyRoute();
  if (ok) {
    connectLive();
    loadActivity();
    startActivityTicker();
  }
})();
</script>
</body>
</html>
